<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rhezie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#eef2e4;--card:#fffaf0;--ink:#4a3f38;--soft:#7a6d63;--line:#8a7b6e;--shadow:rgba(90,110,70,.25);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2620;--card:#2b3029;--ink:#f1e8da;--soft:#c3b8a8;--line:#b9ab98;--shadow:rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#1d2620;--card:#2b3029;--ink:#f1e8da;--soft:#c3b8a8;--line:#b9ab98;--shadow:rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:1.05rem;line-height:1.5;overflow-x:hidden}
.pill{font:inherit;font-size:1.25rem;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:5px 24px;cursor:pointer;transition:transform .15s}
.pill:hover{transform:translateY(-2px)}
.pill:focus-visible,.bal:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:50%}
.stage img{position:absolute;display:block;user-select:none;-webkit-user-drag:none}
.stage>img.base{inset:0;width:100%;height:100%}
.gr{transform-origin:50% 100%;animation:grass var(--d) ease-in-out var(--dl) infinite;pointer-events:none}
@keyframes grass{0%,100%{transform:skewX(calc(var(--s)*-.15))}40%{transform:skewX(calc(var(--s)*-1))}70%{transform:skewX(calc(var(--s)*-.45))}}
.bal{position:absolute;padding:0;border:0;background:none;cursor:pointer;transform-origin:var(--px) var(--py);animation:sway var(--d) ease-in-out var(--dl) infinite}
.bal img{position:static;width:100%;height:100%;pointer-events:none;transition:filter .2s}
.bal:hover img{filter:brightness(1.06) saturate(1.1)}
@keyframes sway{0%,100%{transform:rotate(calc(var(--a)*-.3))}50%{transform:rotate(var(--a))}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.leaf{opacity:0;transform-box:fill-box;transform-origin:center;animation:fall var(--t) linear var(--dl) infinite}
@keyframes fall{0%{opacity:0;transform:translate(0,0) rotate(0)}6%{opacity:1}
25%{transform:translate(calc(var(--dx)*.22),calc(var(--dy)*.3)) rotate(calc(var(--r)*.3))}
50%{transform:translate(calc(var(--dx)*.5),calc(var(--dy)*.5)) rotate(calc(var(--r)*.55))}
75%{transform:translate(calc(var(--dx)*.78),calc(var(--dy)*.78)) rotate(calc(var(--r)*.8))}
94%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
#scrim{position:fixed;inset:0;background:rgba(40,50,35,.4);display:none;z-index:20}
#panel{position:fixed;z-index:21;left:50%;top:50%;width:min(92vw,540px);max-height:80vh;overflow:auto;transform:translate(-50%,-50%);background:var(--card);border:3px solid var(--ac,#f3b4bf);border-radius:24px;padding:22px 26px 26px;display:none;box-shadow:0 14px 40px rgba(0,0,0,.25)}
#panel h2{font-family:Georgia,"Times New Roman",serif;font-size:2.2rem;margin:0 0 6px}
#panel ul{padding-left:1.2em;margin:.4em 0}
#panel a{color:var(--ink);font-weight:bold}
#close{position:absolute;right:14px;top:8px;font:inherit;font-size:1.7rem;background:none;border:0;color:var(--ink);cursor:pointer;line-height:1}
.mem{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:10px}
.mem div{border:2px dashed var(--line);border-radius:12px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:1rem;color:var(--soft)}
.note{font-size:.95rem;color:var(--soft)}
#editbar{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:8px 14px;box-shadow:0 8px 24px var(--shadow);max-width:94vw;font-size:1rem}
.editing [contenteditable]{outline:2px dashed var(--line);outline-offset:4px;border-radius:6px}
.strs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bal{container-type:inline-size}
.rt{position:absolute;transform:translate(-50%,-50%) rotate(-9deg);font-family:"Patrick Hand","Segoe Print","Comic Sans MS",cursive;font-size:15cqw;line-height:1.1;color:#5a4638;text-align:center;pointer-events:none;white-space:nowrap}
/* Landscape and desktop screens: the picture fills the whole screen (cropped at the top and bottom) */

body{overflow:hidden}
.view{position:fixed;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.scene{position:absolute;--sw:max(100vw,calc(100dvh*2030/1278));--sh:calc(var(--sw)*1278/2030);width:var(--sw);height:var(--sh);left:calc((100vw - var(--sw))*.4);top:max(calc(100dvh - var(--sh)),calc(var(--sh)*-.035))}
.ext{position:absolute;inset:0;width:100%;height:100%}
.stage{position:absolute;left:15.764%;top:0;width:60.591%;height:100%;overflow:hidden;background:#dfe9ec}
#bf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#editbar{right:auto;left:12px}
@media (max-aspect-ratio:19/20){
.view{background:var(--bg)}
.scene{position:relative;left:auto;top:auto;width:min(100vw,calc((100dvh - 24px)*1230/1278));height:auto;aspect-ratio:1230/1278;overflow:hidden;border-radius:18px;box-shadow:0 10px 30px var(--shadow)}
.ext{display:none}
.stage{left:0;width:100%}
#bf{left:-26.02%;width:165.04%;inset:auto;top:0;height:100%}
}
@media (prefers-reduced-motion:reduce){.bal,.gr,.leaf{animation:none}}
</style>
</head>

<script type="application/json" id="content">{"know": ["Get to know me", "A few things that don’t fit on a résumé:\n- I’m happiest when I’m building something from a rough sketch.\n- I collect notebooks and rarely finish them.\n- Ask me about my favorite place to think.", "#f3b4bf"], "mem": ["My memories", "Moments that shaped me.\nphoto: Add a photo of a first project\nphoto: Add a photo of a favorite trip\nphoto: Add a photo of friends & team", "#a9d3e8"], "about": ["About me", "I’m [Your Name], a [your role] based in [your city]. I care about clear, friendly work that people enjoy using.\nWhat I do: [skill one], [skill two], [skill three].", "#f6b6c3"], "journey": ["My journey", "- [Year] – Where it started: [school or first job].\n- [Year] – A turning point: [project or move].\n- Today – [What you’re working on now].", "#fbe08f"], "ach": ["My achievements", "- [Award, certification or milestone]\n- [Project you shipped and what it changed]\n- [Number you’re proud of, like users, sales or grades]", "#b5d6a5"], "insp": ["My inspirations", "- [A person who taught you something]\n- [A book, show or place]\n- [A problem you keep wanting to solve]", "#cdb3e8"], "hire": ["Hire me", "I’m open to [full-time roles / freelance projects].\nEmail me at you@example.com\nAdd your résumé and social links here.", "#a9c8ee"], "resume": ["My resume", "My resume is coming soon.\n- Education: [school and year]\n- Experience: [role, place, dates]\n- Skills: [skill one], [skill two], [skill three]", "#f8c9a6"]}</script>
<script>

/* Butterflies fluttering around the meadow */
(function(){
  const svg=document.getElementById("bf"),NS="http://www.w3.org/2000/svg",ink="#5a4638";
  const mk=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
  const defs=[
   {c:"#f5a35a",x:900,y:1010,ax:330,ay:90,sx:.34,sy:.5,s:.95},
   {c:"#f3a0c0",x:1280,y:770,ax:200,ay:120,sx:.42,sy:.31,s:.85},
   {c:"#8fc3ea",x:560,y:900,ax:200,ay:70,sx:.5,sy:.37,s:.8},
   {c:"#f6d867",x:1230,y:1100,ax:260,ay:60,sx:.3,sy:.47,s:.9},
   {c:"#c4a8e3",x:1020,y:830,ax:240,ay:90,sx:.38,sy:.29,s:.75}
  ].map((d,i)=>{
    const g=mk("g",{},svg),b=mk("g",{},g);
    const wing=(sign)=>{const w=mk("g",{},b);
      mk("path",{d:"M0 -2C-6 -20-30 -27-33 -10C-35 2-14 4 0 0Z",fill:d.c,stroke:ink,"stroke-width":1.2,"stroke-linejoin":"round"},w);
      mk("path",{d:"M0 2C-8 6-26 14-20 25C-14 33-4 16 0 4Z",fill:d.c,stroke:ink,"stroke-width":1.2,"stroke-linejoin":"round"},w);
      mk("circle",{cx:-20,cy:-11,r:4.5,fill:"#fff","fill-opacity":.65},w);
      return w};
    const wl=wing(),wr=wing();
    mk("ellipse",{cx:0,cy:0,rx:2.4,ry:11,fill:ink},b);
    mk("path",{d:"M-1 -10Q-5 -19-10 -21M1 -10Q5 -19 10 -21",fill:"none",stroke:ink,"stroke-width":1.1,"stroke-linecap":"round"},b);
    return Object.assign(d,{g,wl,wr,ph:i*1.7,fl:9+i*1.1});
  });
  const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
  const pos=(d,t)=>({x:d.x+d.ax*Math.sin(d.sx*t+d.ph)+d.ax*.35*Math.sin(2.3*d.sx*t),y:d.y+d.ay*Math.sin(d.sy*t+d.ph*1.3)});
  function frame(ms){
    const t=still?0:ms/1000;
    defs.forEach(d=>{
      const a=pos(d,t),b=pos(d,t+.05);
      const ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI+90;
      const f=still?.9:.22+.78*Math.abs(Math.cos(d.fl*t+d.ph));
      d.g.setAttribute("transform",`translate(${a.x.toFixed(1)} ${a.y.toFixed(1)}) rotate(${ang.toFixed(1)}) scale(${d.s})`);
      d.wl.setAttribute("transform",`scale(${f.toFixed(2)} 1)`);d.wr.setAttribute("transform",`scale(${(-f).toFixed(2)} 1)`);
    });
    if(!still)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
/* Leaves blown from the tree */
const fx=document.getElementById("fx"),NS="http://www.w3.org/2000/svg";
const cols=["#8fb55e","#a7c86f","#6f9a52","#b8cf7b","#7fa95a"];
for(let i=0;i<14;i++){
  const x=60+Math.random()*500, y=360-(x-60)*.4+(Math.random()*30-15);
  const p=document.createElementNS(NS,"path");
  p.setAttribute("d","M0 0 C9 -13 27 -13 36 0 C27 13 9 13 0 0 Z M2 0 L33 0");
  p.setAttribute("fill",cols[i%cols.length]);p.setAttribute("stroke","#5f8446");p.setAttribute("stroke-width","1.2");
  p.setAttribute("transform",`translate(${x} ${y})`);
  const g=document.createElementNS(NS,"g");g.setAttribute("transform",`translate(${x} ${y})`);
  p.removeAttribute("transform");
  const s=document.createElementNS(NS,"g");s.setAttribute("class","leaf");
  s.style.setProperty("--dx",(300+Math.random()*350)+"px");
  s.style.setProperty("--dy",(560+Math.random()*200)+"px");
  s.style.setProperty("--r",(240+Math.random()*420)+"deg");
  s.style.setProperty("--t",(9+Math.random()*5)+"s");
  s.style.setProperty("--dl",(-Math.random()*14)+"s");
  s.appendChild(p);g.appendChild(s);fx.appendChild(g);
}

/* Content comes from the JSON block above; the owner can edit it in the page */
const C=JSON.parse(document.getElementById("content").textContent);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const link=s=>esc(s).replace(/[\w.+-]+@[\w-]+\.[\w.-]+/g,m=>`<a href="mailto:${m}">${m}</a>`);
function render(text){
  let out="",mode="";
  const shut=()=>{if(mode)out+=mode==="ul"?"</ul>":"</div>";mode=""};
  text.split("\n").forEach(l=>{
    if(!l.trim())return;
    if(l.startsWith("- ")){if(mode!=="ul"){shut();out+="<ul>";mode="ul"}out+=`<li>${link(l.slice(2))}</li>`}
    else if(/^photo:/i.test(l)){if(mode!=="mem"){shut();out+='<div class="mem">';mode="mem"}out+=`<div>${esc(l.replace(/^photo:\s*/i,""))}</div>`}
    else{shut();out+=`<p>${link(l)}</p>`}
  });
  shut();return out;
}
const panel=document.getElementById("panel"),scrim=document.getElementById("scrim"),pb=document.getElementById("pbody");
let last;
let editing=false;
function open(k){
  last=document.activeElement;
  panel.style.setProperty("--ac",C[k][2]);
  if(editing){
    pb.innerHTML=`<h2 id="ptitle">Edit this note</h2><label>Title<br><input id="et" style="width:100%;font:inherit;padding:6px"></label><p><label>Text<br><textarea id="eb" rows="9" style="width:100%;font:inherit;padding:6px"></textarea></label></p><p class="note">Start a line with “- ” for a bullet. Start with “photo:” for a photo box. Email addresses become links.</p><button class="pill" id="ok">Done</button>`;
    document.getElementById("et").value=C[k][0];document.getElementById("eb").value=C[k][1];
    document.getElementById("ok").onclick=()=>{C[k][0]=document.getElementById("et").value;C[k][1]=document.getElementById("eb").value;onChange();close()};
  }else pb.innerHTML=`<h2 id="ptitle">${esc(C[k][0])}</h2>${render(C[k][1])}`;
  panel.style.display=scrim.style.display="block";
  document.getElementById("close").focus();
}
function close(){panel.style.display=scrim.style.display="none";if(last&&last.focus)last.focus()}
document.querySelectorAll("[data-k]").forEach(b=>b.addEventListener("click",()=>open(b.dataset.k)));
document.getElementById("close").onclick=close;scrim.onclick=close;
addEventListener("keydown",e=>{if(e.key==="Escape")close()});

/* Owner-only editor: text is editable in place for people who can edit this page */
let onChange=()=>{};
async function initEditor(art){
  editing=true;document.body.classList.add("editing","editor");
    const bar=document.createElement("div");bar.id="editbar";
  bar.innerHTML='<span>Tap a balloon to edit its note, then press Save.</span><button class="pill" id="eSave" disabled>Save</button>';
  document.body.appendChild(bar);
  const s=document.getElementById("eSave");
  onChange=()=>{s.disabled=false;s.textContent="Save"};
  s.onclick=async()=>{
    s.textContent="Saving…";s.disabled=true;
    const d=document.documentElement.cloneNode(true);
    d.querySelector("#fx").innerHTML="";d.querySelector("#bf").innerHTML="";d.querySelector("#pbody").innerHTML="";
    d.querySelector("#editbar").remove();
    ["#panel","#scrim"].forEach(q=>d.querySelector(q).removeAttribute("style"));
    d.querySelector("body").removeAttribute("class");
    d.querySelectorAll("[contenteditable],[spellcheck]").forEach(x=>{x.removeAttribute("contenteditable");x.removeAttribute("spellcheck")});
    d.querySelector("#content").textContent=JSON.stringify(C).replace(/</g,"\\u003c");
    try{await art.publish("<!DOCTYPE html>\n"+d.outerHTML)}catch(err){s.textContent="Save failed – try again";s.disabled=false}
  };
}
(async()=>{try{
  if(typeof claude==="undefined")return;
  const u=await claude.use("user");if(!u||!u.canEdit())return;
  const a=await claude.use("artifact");if(a)initEditor(a);
}catch(e){}})();
</script>
